<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>菠萝 · 展板工作台</title><link rel="stylesheet" href="editor.css"></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-icon">▧</span><strong>菠萝</strong><span class="muted">展板工作台</span><span class="prototype">原型 0.1</span></div><div class="top-actions"><button data-action="import" title="打开布局 JSON 或已保存网页">打开</button><button data-action="undo" id="undo" title="Ctrl+Z">↶</button><button data-action="redo" id="redo" title="Ctrl+Shift+Z">↷</button><span class="divider"></span><button data-action="fit" title="Ctrl+0">适合窗口</button><button data-action="actual">100%</button><button class="accent" data-action="save" title="Ctrl+S">保存网页</button><button data-action="export">导出 <span class="muted">⌄</span></button></div></header>
<nav class="pagebar"><div id="tabs" role="tablist" aria-label="展板页签"></div><button class="add-page" data-action="newPage" title="新增展板">＋</button><span class="pagebar-end">本地编辑 · 无需联网</span></nav>
<section class="contextbar"><strong id="toolTitle">移动</strong><span class="divider"></span><div id="toolOptions" class="tool-options" hidden></div><div id="contextFields"><label>X <input id="cx" type="number" step="0.1" aria-label="X 位置"></label><label>Y <input id="cy" type="number" step="0.1" aria-label="Y 位置"></label><label>W <input id="cw" type="number" min="0.1" step="0.1" aria-label="元素宽度"></label><button id="ratioLock" data-action="ratio" title="锁定缩放比例" aria-pressed="true">↔</button><label>H <input id="ch" type="number" min="0.1" step="0.1" aria-label="元素高度"></label><span class="unit">mm</span><label>∠ <input id="cr" type="number" step="1" aria-label="旋转角度"></label><span class="unit">°</span></div><div class="context-right"><label class="check"><input id="snap" type="checkbox" checked>吸附</label><button data-action="guides" title="参考线设置">参考线</button><button data-action="grid" id="gridButton" aria-pressed="false">网格</button><button data-action="canvasOnly" title="F / Tab">隐藏面板</button></div></section>
<main class="workspace"><aside id="tools" class="toolrail" aria-label="工具栏"></aside><section class="canvas-region"><div class="ruler-corner">mm</div><svg id="rulerX" class="ruler-x" aria-label="水平标尺"></svg><svg id="rulerY" class="ruler-y" aria-label="垂直标尺"></svg><div id="viewport" tabindex="0" aria-label="展板画布"><div id="paper"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div><div class="canvas-hint" id="canvasHint">空格拖动画布 · 滚轮平移 · Ctrl + 滚轮缩放</div><textarea id="inlineText" aria-label="画布内文字编辑" spellcheck="false" hidden></textarea></div></section><aside class="inspector"><section class="panel properties"><div class="panel-heading"><strong id="propertyTitle">展板设置</strong><button data-action="pageSettings" title="展板设置">⚙</button></div><div id="properties"></div></section><section class="layers panel"><div class="panel-heading"><strong>图层</strong><span id="layerCount" class="muted"></span><button data-action="group" title="编组 Ctrl+G">⊞</button></div><div class="layer-filter"><input id="layerSearch" placeholder="搜索图层…" aria-label="搜索图层"></div><div id="layerList" class="layer-list" aria-label="图层列表"></div><div class="layer-footer"><button data-action="group" title="编组 Ctrl+G">编组</button><button data-action="ungroup" title="取消编组 Ctrl+Shift+G">解组</button><button data-action="duplicate" title="复制 Ctrl+D">复制</button><button data-action="delete" title="删除 Delete">删除</button></div></section></aside></main>
<footer class="statusbar"><div><button data-action="zoomOut" aria-label="缩小">−</button><button id="zoomLabel" data-action="fit">100%</button><button data-action="zoomIn" aria-label="放大">＋</button><span class="divider"></span><span id="dimensions"></span></div><span id="status" role="status" aria-live="polite">就绪</span><span id="selectionInfo" class="muted"></span></footer>
<input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" multiple hidden><input id="projectFile" type="file" accept=".json,.html" hidden><input id="foregroundPicker" type="color" value="#b8c6d2" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0" aria-label="前景色">
<dialog id="modal"><form method="dialog"><div class="dialog-head"><strong id="dialogTitle"></strong><button value="cancel" aria-label="关闭">✕</button></div><div id="dialogBody"></div><div class="dialog-actions" id="dialogActions"></div></form></dialog><div id="printArea"></div>
<script id="projectData" type="application/json">__BOARD_PROJECT__</script><script src="editor.js"></script>
</body></html>
